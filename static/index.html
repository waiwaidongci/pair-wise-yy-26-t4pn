<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>漏洞披露协作</title><style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f4f6f8}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,select,textarea,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#7a1f1f;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.req{border:1px solid #ddd;border-radius:8px;padding:8px;margin:6px 0;line-height:1.7}.req b{color:#7a1f1f}</style><h1>开源漏洞披露协作</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>报告协同</h2><div class="grid"><input id="report" type="number" placeholder="报告 ID"><input id="user" type="number" placeholder="用户 ID"><input id="coord" type="number" placeholder="协调员 ID"><input id="status" placeholder="new/triaged/fixing/resolved"><input id="deadline" value="2026-12-31"><input id="reason" placeholder="延期理由"></div><button onclick="view()">查看可见报告</button><button onclick="setStatus()">更新状态</button><button onclick="extend()">延长保密期</button><button onclick="publish()">按日期披露</button><pre id="result"></pre></section><section><h2>延期会签</h2><div class="grid"><input id="extreq" type="number" placeholder="会签申请 ID"><select id="decision"><option value="approve">同意</option><option value="reject">反对</option></select><input id="comment" placeholder="会签意见或复核说明"></div><button onclick="requestExt()">发起延期会签</button><button onclick="voteExt()">报告人/维护者会签</button><button onclick="reviewExt()">协调员复核</button><button onclick="listExt()">查看会签进度</button><div id="extlist"></div><pre id="ext"></pre></section><section><h2>材料与公告</h2><input id="material" placeholder="材料名"><textarea id="content" placeholder="材料或公告内容"></textarea><button onclick="evidence()">添加材料</button><button onclick="advisory()">保存公告草稿</button><button onclick="getAdvisory()">读取公告</button><pre id="extra"></pre></section><script>const show=(el,x)=>document.querySelector(el).textContent=JSON.stringify(x,null,2);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(u,el='#result'){show(el,await(await fetch(u)).json())}async function post(u,b,el='#result'){show(el,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function view(){get('/api/reports/'+report.value+'?user_id='+user.value)}function setStatus(){post('/api/reports/'+report.value+'/status',{status:status.value,user_id:+coord.value,note:'页面更新'})}function extend(){post('/api/extensions',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value})}function publish(){post('/api/reports/'+report.value+'/publish',{coordinator_id:+coord.value,as_of:deadline.value})}function requestExt(){post('/api/extension-requests',{report_id:+report.value,new_deadline:deadline.value,reason:reason.value,coordinator_id:+coord.value},'#ext')}function voteExt(){post('/api/extension-requests/'+extreq.value+'/vote',{user_id:+user.value,decision:decision.value,comment:comment.value},'#ext')}function reviewExt(){post('/api/extension-requests/'+extreq.value+'/review',{coordinator_id:+coord.value,decision:decision.value,note:comment.value},'#ext')}async function listExt(){const d=await(await fetch('/api/reports/'+report.value+'?user_id='+user.value)).json();const reqs=d.extension_requests||[];const dec={approve:'同意',reject:'反对'},st={voting:'会签中',review:'待复核',approved:'已生效',rejected:'已关闭',invalidated:'已失效'};document.querySelector('#extlist').innerHTML=reqs.map(r=>`<div class="req"><b>#${r.id}</b> 保密期 ${esc(r.old_deadline)} → ${esc(r.new_deadline)}（${st[r.status]||esc(r.status)}）<br>理由：${esc(r.reason)}；发起：${esc(r.coordinator_name)}${r.reviewer_name?'；复核：'+esc(r.reviewer_name):''}<br>意见：${r.votes.length?r.votes.map(v=>esc(v.user_name)+'：'+(dec[v.decision]||esc(v.decision))+(v.comment?'（'+esc(v.comment)+'）':'')).join('，'):'暂无'}${r.waiting_on?'<br>当前卡在：'+esc(r.waiting_on):''}</div>`).join('')||'暂无延期会签';show('#ext',reqs)}function evidence(){post('/api/evidence',{report_id:+report.value,name:material.value,content:content.value,classification:'private',uploaded_by:+user.value})}function advisory(){post('/api/advisories',{report_id:+report.value,content:content.value,user_id:+coord.value},'#extra')}function getAdvisory(){get('/api/reports/'+report.value+'/advisory?user_id='+user.value,'#extra')}state()</script></html>
